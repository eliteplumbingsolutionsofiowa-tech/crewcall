<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>CrewCall</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(145deg,#020617,#0f172a,#172554); color: white; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width: min(92%,460px); padding: 42px 28px; text-align: center; border: 1px solid rgba(255,255,255,.12); border-radius: 32px; background: rgba(255,255,255,.07); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    .mark { width: 84px; height: 84px; margin: auto; display: grid; place-items: center; border-radius: 24px; background: linear-gradient(135deg,#22d3ee,#2563eb); font-size: 34px; font-weight: 900; }
    h1 { margin: 24px 0 8px; font-size: 44px; }
    p { margin: 8px 0; color: #cbd5e1; font-weight: 700; }
    .status { margin-top: 28px; padding: 14px; border-radius: 16px; background: rgba(34,211,238,.12); color: #a5f3fc; }
  </style>
</head>
<body>
  <main>
    <div class="mark">C</div>
    <h1>CrewCall</h1>
    <p>Find Help. Find Work. Fast.</p>
    <div class="status">Native mobile foundation installed successfully.</div>
  </main>
</body>
</html>
