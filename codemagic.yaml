workflows:
  crewcall-ios-simulator:
    name: CrewCall iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: 26.4
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate iOS project
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Build iOS Simulator app
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        script: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/CrewCall-Simulator.zip" App.app
    artifacts:
      - CrewCall-Simulator.zip
      - build/Build/Products/Debug-iphonesimulator/App.app
